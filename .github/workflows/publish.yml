# cspell:words ncipollo

name: publish
on:
  pull_request:
    types: [closed]
    branches:
      - 'v*.*.*'
      - develop
      - beta
      - release-candidate
      - stable
  push:
    tags:
      - 'custom-release-*'
    branches:
      - publish-types  # Allow direct push testing

env:
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest

    # Run on: merged PRs, push to publish-types branch, or tags
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    outputs:
      version: ${{ steps.version.outputs.version }}
      is_test: ${{ steps.check_test.outputs.is_test }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'

    - name: Install project
      run: yarn install

    - name: Check if test run
      id: check_test
      run: |
        export BRANCH=${GITHUB_REF##*/}
        if [[ "$BRANCH" == "publish-types" ]]; then
          echo "is_test=true" >> "$GITHUB_OUTPUT"
          echo "🧪 TEST MODE: Running on publish-types branch"
        else
          echo "is_test=false" >> "$GITHUB_OUTPUT"
          echo "📦 PRODUCTION MODE: Will publish artifacts"
        fi

    - name: Calculate version
      id: version
      run: |
        export BRANCH=${GITHUB_REF##*/}
        echo "Branch $BRANCH"
        export VERSION=$(bash ./scripts/calculate_version.sh)
        echo "Version $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        ( test $BRANCH = "stable" || test $BRANCH = "master" && export PRERELEASE=false ) || export PRERELEASE=true
        echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV

    - name: Generate ABI
      run: yarn hardhat run scripts/generateAbi.ts

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: data
        path: data

    - name: Create Release
      if: steps.check_test.outputs.is_test != 'true'
      uses: ncipollo/release-action@v1
      with:
        commit: ${{ github.sha }}
        tag: ${{ env.VERSION }}
        prerelease: ${{ env.PRERELEASE }}
        artifacts: "data/fair-manager-*-abi.json"

  abi:
    runs-on: ubuntu-latest

    needs:
      build

    # Skip ABI commit on test runs
    if: needs.build.outputs.is_test != 'true'

    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: abi

      - name: Load artifacts
        uses: actions/download-artifact@v5
        with:
          name: data

      - name: Commit ABI
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Add ABI for version ${{ env.VERSION }}"
          add: "*-abi.json"

  types:
    runs-on: ubuntu-latest

    needs:
      build

    env:
      VERSION: ${{ needs.build.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install project
        run: yarn install

      - name: Generate TypeChain types
        run: yarn generateTypes

      - name: Build types package
        run: yarn buildTypesPackage

      - name: Publish types package
        if: needs.build.outputs.is_test == 'true'
        working-directory: types-package
        run: yarn npm publish --access public

  docker:
    runs-on: ubuntu-latest

    needs:
      build

    # Skip docker on test runs
    if: |
      needs.build.outputs.is_test != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.merged == true)

    steps:
    - uses: actions/checkout@v5

    - name: Build and publish container
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        export BRANCH=${GITHUB_REF##*/}
        echo "Branch $BRANCH"
        export VERSION=$(bash ./scripts/calculate_version.sh)
        echo "Version $VERSION"
        bash ./scripts/build_and_publish.sh
