# cspell:words ncipollo

name: publish
on:
  pull_request:
    types: [closed]
    branches:
      - 'v*.*.*'
      - develop
      - beta
      - release-candidate
      - stable
  push:
    tags:
      - 'custom-release-*'

env:
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'

    - name: Install project
      run: yarn install

    - name: Calculate version
      id: version
      run: |
        export BRANCH=${GITHUB_REF##*/}
        echo "Branch $BRANCH"
        export VERSION=$(bash ./scripts/calculate_version.sh)
        echo "Version $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        ( test $BRANCH = "stable" || test $BRANCH = "master" && export PRERELEASE=false ) || export PRERELEASE=true
        echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV

    - name: Generate ABI
      run: yarn hardhat run scripts/generateAbi.ts

    - name: Store artifacts
      uses: actions/upload-artifact@v5
      with:
        name: data
        path: data

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        commit: ${{ github.sha }}
        tag: ${{ env.VERSION }}
        prerelease: ${{ env.PRERELEASE }}
        artifacts: "data/fair-manager-*-abi.json"

  abi:
    runs-on: ubuntu-latest

    needs:
      build

    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: abi

      - name: Load artifacts
        uses: actions/download-artifact@v6
        with:
          name: data

      - name: Commit ABI
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Add ABI for version ${{ env.VERSION }}"
          add: "*-abi.json"

  comment-release:
    runs-on: ubuntu-latest

    needs:
      build

    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Get linked issues
        id: get-issues
        uses: mondeja/pr-linked-issues-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Comment on linked issues
        if: steps.get-issues.outputs.issues != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION;
            const tagUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${version}`;
            const commentBody = `Release created: [${version}](${tagUrl})`;

            const issues = '${{ steps.get-issues.outputs.issues }}';
            const issueNumbers = JSON.parse(issues);

            // Comment on each linked issue
            for (const issueNumber of issueNumbers) {
              console.log(`Commenting on issue #${issueNumber}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
            }

  types:
    runs-on: ubuntu-latest

    needs:
      build

    env:
      VERSION: ${{ needs.build.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install project
        run: yarn install

      - name: Generate TypeChain types
        run: yarn generateTypes

      - name: Build types package
        run: yarn buildTypesPackage

      - name: Publish types package
        working-directory: types-package
        run: |
          BRANCH=${GITHUB_REF##*/}
          TAG=""
          if [[ "$BRANCH" != "stable" ]]; then
            TAG="--tag $BRANCH"
          fi
          npm publish --access public $TAG

  docker:
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true

    steps:
    - uses: actions/checkout@v5

    - name: Build and publish container
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        export BRANCH=${GITHUB_REF##*/}
        echo "Branch $BRANCH"
        export VERSION=$(bash ./scripts/calculate_version.sh)
        echo "Version $VERSION"
        bash ./scripts/build_and_publish.sh
